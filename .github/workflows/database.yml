name: Supabase offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npm run lint:edge
      - run: deno fmt --check --config functions/social-api/deno.json functions/social-api
      - run: npm test
